services:

  # ==========================================
  # BACKEND : NODE.JS + EXPRESS + SQLITE
  # ==========================================
  backend:
    image: honoralien/novae-backend:sha-93857fb5a518c6baa1b9478be22b41ff32907b8e
    pull_policy: always

    container_name: novae-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 4000
      SQLITE_DB_PATH: /app/data/luxe.db
      UPLOAD_DIR: /app/uploads/products

    volumes:
      # Conservation de la base SQLite existante
      - ./backend/db:/app/data

      # Conservation des images existantes
      - ./backend/uploads:/app/uploads

    expose:
      - "4000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - novae-network


  # ==========================================
  # FRONTEND : REACT + NGINX
  # ==========================================
  frontend:
    image: honoralien/novae-frontend:sha-93857fb5a518c6baa1b9478be22b41ff32907b8e
    pull_policy: always

    container_name: novae-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - novae-network


# ==========================================
# RESEAU INTERNE
# ==========================================
networks:
  novae-network:
    driver: bridge
