apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: novae
  labels:
    app: novae-backend
spec:
  type: ClusterIP
  selector:
    app: novae-backend
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: novae-frontend
  namespace: novae
  labels:
    app: novae-frontend
spec:
  type: ClusterIP
  selector:
    app: novae-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
