apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: novae-sqlite-pvc
  namespace: novae
  labels:
    app.kubernetes.io/name: novae
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: novae-uploads-pvc
  namespace: novae
  labels:
    app.kubernetes.io/name: novae
    app.kubernetes.io/component: uploads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
