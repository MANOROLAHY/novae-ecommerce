name: NOVAE CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1 : TESTS ET VALIDATION
  # ==========================================
  test:
    name: Tests backend et frontend
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dépendances backend
        run: npm ci
        working-directory: backend

      - name: Vérifier la syntaxe JavaScript du backend
        run: find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
        working-directory: backend

      - name: Exécuter les tests backend
        run: npm test
        working-directory: backend

      - name: Installer les dépendances frontend
        run: npm ci
        working-directory: frontend

      - name: Exécuter les tests frontend
        run: npm test
        working-directory: frontend

      - name: Compiler le frontend
        run: npm run build
        working-directory: frontend


  # ==========================================
  # JOB 2 : BUILD ET PUBLICATION DOCKER
  # ==========================================
  docker:
    name: Construction et publication Docker
    runs-on: ubuntu-latest

    needs: test

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ======================================
      # IMAGE BACKEND
      # ======================================
      - name: Construire et publier le backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            honoralien/novae-backend:latest
            honoralien/novae-backend:sha-${{ github.sha }}

      # ======================================
      # IMAGE FRONTEND
      # ======================================
      - name: Construire et publier le frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            honoralien/novae-frontend:latest
            honoralien/novae-frontend:sha-${{ github.sha }}
