name: NOVAE CI/CD - Versionnement

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests backend et frontend
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dépendances backend
        run: npm ci
        working-directory: backend

      - name: Vérifier la syntaxe JavaScript du backend
        run: find . -path './node_modules' -prune -o -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
        working-directory: backend

      - name: Exécuter les tests backend
        run: npm test
        working-directory: backend

      - name: Installer les dépendances frontend
        run: npm ci
        working-directory: frontend

      - name: Exécuter les tests frontend
        run: npm test
        working-directory: frontend

      - name: Compiler le frontend
        run: npm run build
        working-directory: frontend

  docker:
    name: Construction et publication Docker
    runs-on: ubuntu-latest
    needs: test

    if: >-
      ${{
        github.event_name != 'pull_request' &&
        (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/tags/v')
        )
      }}

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Préparer les métadonnées de version
        id: buildmeta
        shell: bash
        run: |
          set -euo pipefail

          BACKEND_VERSION="$(node -p "require('./backend/package.json').version")"
          FRONTEND_VERSION="$(node -p "require('./frontend/package.json').version")"

          if [[ "$BACKEND_VERSION" != "$FRONTEND_VERSION" ]]; then
            echo "ERREUR : les versions backend et frontend sont différentes."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"

            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERREUR : le tag Git ne respecte pas le format vX.Y.Z."
              exit 1
            fi

            if [[ "$VERSION" != "$BACKEND_VERSION" ]]; then
              echo "ERREUR : la version du tag ne correspond pas aux package.json."
              exit 1
            fi
          else
            VERSION="${BACKEND_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          fi

          CREATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

          echo "Version préparée : $VERSION"

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier le backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          sbom: true
          tags: |
            honoralien/novae-backend:${{ steps.buildmeta.outputs.version }}
            honoralien/novae-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=NOVAE Backend
            org.opencontainers.image.description=API backend de la plateforme e-commerce NOVAE
            org.opencontainers.image.source=https://github.com/MANOROLAHY/novae-ecommerce
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.buildmeta.outputs.created }}
            org.opencontainers.image.version=${{ steps.buildmeta.outputs.version }}

      - name: Construire et publier le frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          sbom: true
          tags: |
            honoralien/novae-frontend:${{ steps.buildmeta.outputs.version }}
            honoralien/novae-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=NOVAE Frontend
            org.opencontainers.image.description=Interface frontend de la plateforme e-commerce NOVAE
            org.opencontainers.image.source=https://github.com/MANOROLAHY/novae-ecommerce
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.buildmeta.outputs.created }}
            org.opencontainers.image.version=${{ steps.buildmeta.outputs.version }}
